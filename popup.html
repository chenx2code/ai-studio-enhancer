<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Studio Enhancer Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header: Product branding and version -->
    <header class="popup-header">
      <div class="brand">
        <img class="brand-icon" src="icons/icon32.png" alt="AI Studio Enhancer" width="22" height="22">
        <span class="brand-name">AI Studio Enhancer</span>
      </div>
      <span class="version-chip" id="versionChip">v1.1.22</span>
    </header>

    <!-- Main Content: Settings options -->
    <main class="popup-main">
      <!-- Section 1: Export Preferences -->
      <div class="section-header">
        <span class="section-title" id="exportSectionTitle">Export Preferences</span>
      </div>

      <div class="settings-card">
        <!-- Option 1: Thinking process -->
        <label class="setting-row" for="includeThoughts">
          <div class="setting-leading-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M12 2C7.03 2 3 6.03 3 11c0 2.78 1.28 5.26 3.29 6.89V20c0 .55.45 1 1 1h9.42c.55 0 1-.45 1-1v-2.11C19.72 16.26 21 13.78 21 11c0-4.97-4.03-9-9-9zm-1 17h-2v-1h2v1zm4 0h-2v-1h2v1zm1.71-3.29l-.71.5V18H8v-1.79l-.71-.5A6.974 6.974 0 0 1 5 11c0-3.86 3.14-7 7-7s7 3.14 7 7c0 1.84-.71 3.52-1.99 4.71z"/>
            </svg>
          </div>
          <div class="setting-info">
            <span class="setting-title" id="thoughtsTitle">Include thinking process</span>
            <span class="setting-desc" id="thoughtsDesc">Export model reasoning and thoughts</span>
          </div>
          <div class="switch-container">
            <input type="checkbox" id="includeThoughts" class="m3-switch-input">
            <div class="m3-switch-track">
              <div class="m3-switch-thumb">
                <svg class="m3-switch-check" viewBox="0 0 24 24" width="11" height="11">
                  <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
              </div>
            </div>
          </div>
        </label>

        <div class="row-divider"></div>

        <!-- Option 2: Original conversation link -->
        <label class="setting-row" for="includeLink">
          <div class="setting-leading-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/>
            </svg>
          </div>
          <div class="setting-info">
            <span class="setting-title" id="linkTitle">Include conversation link</span>
            <span class="setting-desc" id="linkDesc">Add original chat link to Markdown export</span>
          </div>
          <div class="switch-container">
            <input type="checkbox" id="includeLink" class="m3-switch-input">
            <div class="m3-switch-track">
              <div class="m3-switch-thumb">
                <svg class="m3-switch-check" viewBox="0 0 24 24" width="11" height="11">
                  <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
              </div>
            </div>
          </div>
        </label>

        <div class="row-divider"></div>

        <!-- Option 3: Account email -->
        <label class="setting-row" for="includeAccount">
          <div class="setting-leading-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
            </svg>
          </div>
          <div class="setting-info">
            <span class="setting-title" id="accountTitle">Include account email</span>
            <span class="setting-desc" id="accountDesc">Add Google account email to Markdown header</span>
          </div>
          <div class="switch-container">
            <input type="checkbox" id="includeAccount" class="m3-switch-input">
            <div class="m3-switch-track">
              <div class="m3-switch-thumb">
                <svg class="m3-switch-check" viewBox="0 0 24 24" width="11" height="11">
                  <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
              </div>
            </div>
          </div>
        </label>
      </div>

      <!-- Section 2: Notifications -->
      <div class="section-header section-header-secondary">
        <span class="section-title" id="notificationSectionTitle">Notifications</span>
      </div>

      <div class="settings-card">
        <!-- Option 4: Desktop notifications -->
        <label class="setting-row" for="enableNotifications">
          <div class="setting-leading-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/>
            </svg>
          </div>
          <div class="setting-info">
            <span class="setting-title" id="notificationsTitle">Desktop notifications</span>
            <span class="setting-desc" id="notificationsDesc">Notify when generation is complete (background only)</span>
          </div>
          <div class="switch-container">
            <input type="checkbox" id="enableNotifications" class="m3-switch-input">
            <div class="m3-switch-track">
              <div class="m3-switch-thumb">
                <svg class="m3-switch-check" viewBox="0 0 24 24" width="11" height="11">
                  <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
              </div>
            </div>
          </div>
        </label>
      </div>

      <!-- Section 3: Obsidian Settings -->
      <div class="section-header section-header-secondary">
        <span class="section-title" id="obsidianSectionTitle">Obsidian Settings</span>
      </div>

      <div class="settings-card">
        <!-- Option: Always ask folder before export -->
        <label class="setting-row" for="obsidianPromptFolder">
          <div class="setting-leading-icon obsidian-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M9.643 14.012c.615-.183 1.605-.465 2.745-.534-.684-1.725-.849-3.235-.716-4.579.153-1.552.7-2.847 1.234-3.95.114-.235.223-.454.328-.664.149-.297.289-.577.42-.86.217-.47.378-.885.46-1.27.08-.38.08-.719-.014-1.044-.095-.325-.297-.675-.681-1.06a1.6 1.6 0 00-1.475.36l-4.95 4.453a1.602 1.602 0 00-.512.952l-.427 2.83c.67.592 2.327 2.317 3.335 4.71.09.213.174.432.253.656zM5.855 9.937c-.024.1-.057.197-.099.29L3.14 16.058a1.602 1.602 0 00.313 1.772l4.117 4.24c2.102-3.102 1.795-6.02.835-8.3-.728-1.73-1.832-3.083-2.55-3.833z"/>
              <path d="M8.52 22.57c.073.01.146.018.22.02.781.023 2.095.091 3.16.288.87.16 2.593.642 4.011 1.056 1.082.316 2.197-.548 2.354-1.664.115-.814.33-1.735.725-2.58l-.009.004c-.67-1.87-1.523-3.077-2.417-3.847a5.294 5.294 0 00-2.777-1.258c-1.541-.216-2.952.189-3.841.45.532 2.218.368 4.828-1.425 7.53z"/>
              <path d="M19.676 18.538a69.072 69.072 0 001.858-2.952.811.811 0 00-.061-.901c-.516-.684-1.504-2.075-2.042-3.362-.554-1.323-.636-3.378-.64-4.378a1.708 1.708 0 00-.359-1.051L15.235 1.83a3.757 3.757 0 01-.076.545c-.107.503-.307 1.004-.536 1.498-.135.29-.29.601-.446.915-.105.21-.21.42-.31.626-.517 1.068-.998 2.227-1.132 3.59-.125 1.262.046 2.73.814 4.484.128.01.257.025.386.043a6.364 6.364 0 013.327 1.506c.916.79 1.743 1.921 2.414 3.5z"/>
            </svg>
          </div>
          <div class="setting-info">
            <span class="setting-title" id="obsidianPromptFolderTitle">Ask folder before export</span>
            <span class="setting-desc" id="obsidianPromptFolderDesc">Prompt to choose a destination folder on each export</span>
          </div>
          <div class="switch-container">
            <input type="checkbox" id="obsidianPromptFolder" class="m3-switch-input">
            <div class="m3-switch-track">
              <div class="m3-switch-thumb">
                <svg class="m3-switch-check" viewBox="0 0 24 24" width="11" height="11">
                  <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
              </div>
            </div>
          </div>
        </label>

        <div class="row-divider"></div>

        <!-- Default Obsidian Folder (Disabled when prompt mode is active) -->
        <div class="setting-field-row" id="obsidianFolderRow">
          <div class="setting-leading-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
            </svg>
          </div>
          <div class="setting-info">
            <span class="setting-title" id="obsidianFolderTitle">Default target folder</span>
            <span class="setting-desc" id="obsidianFolderDesc">Used when the switch above is disabled</span>
          </div>
          <div class="input-container">
            <input type="text" id="obsidianFolder" class="m3-text-input" placeholder="AI Studio" spellcheck="false">
          </div>
        </div>

        <div class="row-divider"></div>

        <!-- Obsidian Vault Name (Optional) -->
        <div class="setting-field-row">
          <div class="setting-leading-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/>
            </svg>
          </div>
          <div class="setting-info">
            <span class="setting-title" id="obsidianVaultTitle">Vault name</span>
            <span class="setting-desc" id="obsidianVaultDesc">Leave blank for active vault</span>
          </div>
          <div class="input-container">
            <input type="text" id="obsidianVault" class="m3-text-input" placeholder="Default" spellcheck="false">
          </div>
        </div>
      </div>
    </main>

    <!-- Footer: Auto-save status feedback -->
    <footer class="popup-footer">
      <div class="status-indicator" id="statusIndicator">
        <svg class="status-icon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
          <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>
        </svg>
        <span class="status-text" id="statusText">Changes saved automatically</span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
